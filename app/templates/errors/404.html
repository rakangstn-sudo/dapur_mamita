{% extends "base.html" %}

{% block title %}Halaman Tidak Ditemukan — Dapur Mamita{% endblock %}

{% block content %}
<div class="container py-5 my-4 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-4 rounded-4 shadow-sm bg-card border">
                <i class="bi bi-exclamation-diamond text-warning" style="font-size: 4rem;"></i>
                <h2 class="fw-bold mt-3 mb-2 font-display">404 - Halaman Tidak Ditemukan</h2>
                <p class="text-muted mb-4">
                    Maaf, halaman atau menu yang Anda cari tidak dapat ditemukan atau mungkin sudah dipindahkan.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-house me-1"></i> Beranda
                    </a>
                    <a href="{{ url_for('main.menu_list') }}" class="btn btn-warm rounded-pill px-4">
                        <i class="bi bi-book-half me-1"></i> Lihat Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
